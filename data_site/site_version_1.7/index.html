<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>IFIX - Sistema de Gerenciamento</title>
    <link rel="stylesheet" href="css_global.css">
</head>
<body>
    <div id="app">
        <!-- Barra lateral de navegação -->
        <nav class="sidebar">
            <div class="logo">
                <h1><span class="logo-orange">IFIX</span>Boituva</h1>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-page="dashboard">
                    <span>📊 Dashboard</span>
                </li>
                <li class="nav-item" data-page="price">
                    <span>💰 Consulta de Preços</span>
                </li>
                <li class="nav-item" data-page="orderservice">
                    <span>🛠️ Ordem de Serviço</span>
                </li>
                <li class="nav-item" data-page="crm">
                    <span>👥 CRM Clientes</span>
                </li>
                <li class="nav-item" data-page="services">
                    <span>⚙️ Serviços</span>
                </li>
            </ul>
            <div class="user-info">
                <div class="avatar">IF</div>
                <div class="user-details">
                    <span class="username">IFIX Boituva</span>
                    <span class="user-role">Administrador</span>
                </div>
            </div>
        </nav>

        <!-- Conteúdo principal -->
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumb">
                    <span id="currentPage">Dashboard</span>
                </div>
                <div class="header-actions">
                    <button class="btn-notification">🔔</button>
                    <button class="btn-settings">⚙️</button>
                </div>
            </header>

            <!-- Área de conteúdo dinâmico -->
            <div id="pageContent" class="page-content">
                <!-- Conteúdo será carregado dinamicamente aqui -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="databank/bankservice.js"></script>
    <script src="databank/osbank.js"></script>
    <script src="databank/bankcrm.js"></script>
    
    <script src="components/dashboard.js"></script>
    <script src="components/price.js"></script>
    <script src="components/orderservice.js"></script>
    <script src="components/crm.js"></script>
    
    <script src="whatsapp-module.js"></script>
    <script src="app.js"></script>
</body>
</html>
